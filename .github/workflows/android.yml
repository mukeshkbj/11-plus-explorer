# Builds the Android app (.apk) on every push to main.
# Download it from the Actions tab: open the latest run and look under "Artifacts".
name: Build Android app
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npm run build
      - name: Create the Android project (if it is not in the repo yet)
        run: '[ -d android ] || npx cap add android'
      - name: App icon and splash screen
        run: npx capacitor-assets generate --android --iconBackgroundColor "#ffd43b" --splashBackgroundColor "#f8f7ff"
      - run: npx cap sync android
      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: 11-plus-explorer-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
